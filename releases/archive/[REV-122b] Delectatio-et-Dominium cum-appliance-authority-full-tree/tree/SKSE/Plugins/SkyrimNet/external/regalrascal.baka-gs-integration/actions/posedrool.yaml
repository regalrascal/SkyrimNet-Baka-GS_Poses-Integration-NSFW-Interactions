name: PoseDrool
description: |
  YOU are dazed — eyes unfocused, mouth slack, whatever just happened has taken the words
  clean out of your head.
  Held until you stop it, combat starts, or it times out on its own.

  WHEN the mind blanks: smitten by a beauty past all sense, dumbstruck by a sight, floored
  by news, drink finally past cleverness. Pairs naturally with a line of dialogue — the
  half-formed "uh," the sentence that never finds its ending.
questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: PoseDrool_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one dazed and staring.

enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true