name: "baka_calloff"
description: "The initiator of a Baka Motion scene has voluntarily ended their own animation — generate the immediate reactions as the scene is called off."

eventCriteria:
  eventType: "baka_calloff"

response:
  type: "direct_narration"
  content: |
    {{ originator }} has just chosen to stop the interaction with {{ target }} --
    the animation has ended, the contact broken off by their own decision. The
    reason sits in the moment: guilt, fear, a command received, or something
    glimpsed in {{ target }}'s face. Whatever it is colors the exhale -- relief,
    shame, cold pragmatism, or a threat dressed as mercy.

    {{ target }} feels the grip fall away. The response is visceral -- backing
    away, collapse, frozen stillness, anger, or relief -- each possibility
    carrying a different weight. A villain who stopped for pragmatic reasons
    reads differently from a conflicted character who stopped from guilt.

    This is the beat after the release -- the immediate emotional exhale, and
    nothing more. The moment ends here; deeper consequences wait for the
    conversations that follow.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 20
priority: 7
