name: "baka_intervention"
description: "A third party has just forced an ongoing Baka Motion scene to stop — generate the immediate reactions of the intervenor and the participants."

eventCriteria:
  eventType: "baka_intervention"

response:
  type: "direct_narration"
  content: |
    {{ originator }} has just stepped in and forced the scene involving {{ target }} to end.
    The animation has stopped. Everyone freezes for a beat.

    The fallout unfolds in the open. {{ originator }}'s manner in the moment of
    intervention -- authoritative and cold, angry, quietly firm, disgusted. The
    stopped initiator's -- defiant and dangerous, shrinking back, calculating
    their next move. {{ target }}'s, freed -- relief, shock, dissociation, immediate
    tears, silent gratitude. Each follows its owner: a guard reads differently
    than a companion, a cowardly bandit differently than a proud warlord.

    This is the raw moment: intervention complete, scene over, everyone
    responding. Further consequences wait for the follow-up dialogue.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 20
priority: 9
