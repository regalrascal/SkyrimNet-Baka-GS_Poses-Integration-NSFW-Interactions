name: "sdb_spanked"
description: "The spanker reacts immediately after landing a spank or breast slap"

eventCriteria:
  eventType: "sdb_spanked"

response:
  type: "direct_narration"
  content: |
    {{ originator }} just spanked {{ target }}. The follow-through is theirs -- a word, a
    sound, a look, or one line in their own register.

    In an aggressive or non-consensual encounter the moment wears dominance,
    cruelty, ownership, or satisfaction, and the appetite in it is audible -- a
    grunt of approval, a murmured threat, a possessive grip. The pause reads as
    unfinished business, not an ending. Outside of sex it reads differently:
    dominance, amusement, desire, or casual indifference.

    {{ target }}'s reaction comes from the conversation that follows.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 15
priority: 7
