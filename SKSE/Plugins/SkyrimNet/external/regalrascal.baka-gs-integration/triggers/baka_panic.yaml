name: "baka_panic"
description: "The target of a Baka Motion action has just been subjected to a non-consensual or violent act — the target's immediate panic, in-story."

eventCriteria:
  eventType: "baka_panic"

response:
  type: "direct_narration"
  content: |
    {{ target }} has just been subjected to a non-consensual or violent act by
    {{ originator }} -- they are panicking right now, unable to break free.

    What escapes {{ target }} in the terror is raw: a scream, a desperate plea, a
    shocked silence, a defiant word through gritted teeth, or a dissociation that
    carries them somewhere else. The shape of it follows who they are -- a
    warrior breaks differently than a servant, a hardened criminal differently
    than a sheltered villager.

    The panic is still live; the scene holds them. What shows is a single
    line or act of the fear itself -- {{ originator }}'s own moment comes
    separately.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 8
