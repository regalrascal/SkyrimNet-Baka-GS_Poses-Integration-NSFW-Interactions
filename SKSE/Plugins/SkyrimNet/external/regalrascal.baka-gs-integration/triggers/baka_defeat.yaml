name: "baka_defeat"
description: "A character has been physically defeated and is helpless on the ground after losing the AEL struggle QTE. The attacker has a brief window to choose to escalate — or not."

eventCriteria:
  eventType: "baka_defeat"

response:
  type: "direct_narration"
  content: |
    {{ target }} is down{% if originator %}, beaten by {{ originator }}{% endif %}. Nearby actors might
    use — call the action, don't just narrate — Execute, PinHelpless, ChokeHelpless, HelpUp, or
    Release. Execute is the deliberate killing blow on a downed victim — first when the
    loser is an enemy the winner wants dead.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 10
