name: "baka_defeat"
description: "A character has been physically defeated and is helpless on the ground after losing the AEL struggle QTE. The attacker has a brief window to choose to escalate — or not."

eventCriteria:
  eventType: "baka_defeat"

response:
  type: "direct_narration"
  content: |
    {{ target }} is down{% if originator %}, beaten by {{ originator }}{% endif %}. Nearby actors
    face the open choice of what happens next -- Execute, PinHelpless, ChokeHelpless,
    HelpUp, or Release, carried out through the action itself. Execute is the
    deliberate killing blow on a downed victim -- the one a victor reaches for
    when the loser is an enemy the winner wants dead.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 10
