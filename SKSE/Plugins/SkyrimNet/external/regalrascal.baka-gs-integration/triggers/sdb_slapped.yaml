name: "sdb_slapped"
description: "The slapper reacts immediately after striking someone across the face"

eventCriteria:
  eventType: "sdb_slapped"

response:
  type: "direct_narration"
  content: |
    {{ originator }} just slapped {{ target }} across the face. The act is confrontational --
    not sexual -- and the aftermath wears its tone: authority, contempt, punishment,
    anger, or cold satisfaction.

    The next thing out of {{ originator }} -- a word, a sound, a look, or one line --
    carries exactly who they are in that moment. {{ target }}'s answer comes from the
    conversation that follows.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 7
