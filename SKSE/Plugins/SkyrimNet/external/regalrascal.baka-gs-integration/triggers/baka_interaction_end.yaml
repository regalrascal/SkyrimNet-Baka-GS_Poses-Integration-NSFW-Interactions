name: "baka_interaction_end"
description: "A Baka Motion animation has just finished — generate the initiating character's immediate reaction as the physical contact ends and they step back."

eventCriteria:
  eventType: "baka_interaction_end"

response:
  type: "direct_narration"
  content: |
    {{ originator }} has just finished with {{ target }} -- the animation ended and they
    step back. The first thing out of {{ originator }} in that step-back carries the
    whole tone of what just happened: warmth or longing after a tender hug; cold
    satisfaction, dismissal, or quiet threat after a forced act; a smirk or a
    laugh after a playful spank.

    The beat is short, concise, and emotionally precise -- entirely {{ originator }}'s.
    {{ target }}'s answer comes later, in its own moment.

audience: "nearby_npcs"

enabled: true
probability: 0.8
cooldownSeconds: 20
priority: 6
