name: "sdb_tattoo_applied"
description: "A nearby NPC notices a fresh mark has just been applied to someone's skin"

eventCriteria:
  eventType: "sdb_tattoo_applied"

response:
  type: "direct_narration"
  content: |
    {{ target }} now wears a fresh mark on their skin. Anyone who sees it reacts in
    their own register -- a word, a look, a step closer or away.

    The mark itself is named in the event text, and where the marked one's own
    visible reaction was shown, that is part of the scene too; the tone of the
    beat follows what is on display. How the mark came to be is not apparent to
    onlookers, and nothing beyond the event text is. The wearer's own reaction
    belongs to the conversation that follows.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 7
