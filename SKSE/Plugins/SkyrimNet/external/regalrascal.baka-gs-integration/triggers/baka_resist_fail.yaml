name: "baka_resist_fail"
description: "The player tried to break free but failed — generate the initiating NPC's reaction to the target's resistance collapsing."

eventCriteria:
  eventType: "baka_resist_fail"

response:
  type: "direct_narration"
  content: |
    {{ target }} fought back -- and could not break free. The struggle is over and
    {{ originator }} still has them, and knows it.

    What {{ originator }} does with a won struggle says everything: satisfaction,
    contempt, mockery, cold silence, a quiet statement of fact -- or continuing
    as though the attempt meant nothing at all. A sadist savors it, a clinical
    captor files it away, a bully makes sure {{ target }} feels the humiliation.
    Each version is true to a different character.

    One beat: the moment {{ originator }} feels the resistance stop, like a door
    closing.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 9
