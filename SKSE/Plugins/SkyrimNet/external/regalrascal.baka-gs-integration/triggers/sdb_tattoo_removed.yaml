name: "sdb_tattoo_removed"
description: "A nearby NPC notices the mark someone wore has just been wiped away"

eventCriteria:
  eventType: "sdb_tattoo_removed"

response:
  type: "direct_narration"
  content: |
    The mark on {{ target }}'s skin has just been wiped away. Anyone who notices reacts
    in their own register -- relief, curiosity, a comment, or pointed silence.

    The specific mark that was removed is named in the event text; nothing
    beyond it is apparent to onlookers. {{ target }}'s own reaction belongs to
    the conversation that follows.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 7
