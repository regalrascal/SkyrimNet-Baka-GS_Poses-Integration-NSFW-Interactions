name: "baka_resist_success"
description: "The player successfully broke free from a forced Baka Motion animation — generate the initiating NPC's reaction to losing their hold."

eventCriteria:
  eventType: "baka_resist_success"

response:
  type: "direct_narration"
  content: |
    {{ target }} just broke free -- physically tore out of {{ originator }}'s grip, and
    the loss of control lands instantly. The first thing out of {{ originator }} in
    that moment is telling: rage, shock, cold recalculation, wounded pride, or a
    threat about what comes next. A weak character backs down; a dangerous one
    steps forward.

    The escape reshapes the power between them, and {{ originator }}'s reaction shows
    what that change means to who they are. One beat of it.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 9
