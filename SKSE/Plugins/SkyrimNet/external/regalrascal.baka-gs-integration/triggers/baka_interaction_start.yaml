name: "baka_interaction_start"
description: "An NPC has just initiated a Baka Motion animation on another character — generate their immediate in-character reaction at the moment it begins."

eventCriteria:
  eventType: "baka_interaction_start"

response:
  type: "direct_narration"
  content: |
    {{ originator }} has just initiated physical contact with {{ target }} -- the animation
    begins right now, the first touch landing. The opening beat is {{ originator }}'s:
    a word, a breath, a look, or one short line, in the register of the act and
    the character behind it. A gentle hug sounds different from a forced grab; a
    romantic kiss differs from a chokehold; affection, dominance, violation,
    playfulness, and cruelty each carry their own voice in {{ originator }}'s mouth.

    The moment belongs to {{ originator }}'s body and voice. {{ target }}'s reaction
    comes in its own time, from the conversation that follows. One sharp,
    character-true beat.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 15
priority: 7
