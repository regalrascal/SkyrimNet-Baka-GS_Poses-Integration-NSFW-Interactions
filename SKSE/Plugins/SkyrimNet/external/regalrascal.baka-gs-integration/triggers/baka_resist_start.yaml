name: "baka_resist_start"
description: "The player has begun struggling to break free from a forced Baka Motion animation — generate the initiating NPC's reaction to feeling resistance."

eventCriteria:
  eventType: "baka_resist_start"

response:
  type: "direct_narration"
  content: |
    {{ target }} is fighting back -- actively struggling against {{ originator }}'s grip,
    and the resistance registers on {{ originator }} at once. This is the moment it
    becomes clear {{ target }} will not submit quietly.

    What comes out of {{ originator }} follows their character: a tightened grip, a
    sharp word, a threat, a cold laugh, a warning -- or silence and a hold that
    simply clamps harder. A sadist enjoys the struggle, a cold captor finds it
    tiresome, a bully is surprised.

    The beat is {{ originator }}'s alone -- the grip answering the fight against it.

audience: "nearby_npcs"

enabled: true
probability: 0.9
cooldownSeconds: 45
priority: 8
