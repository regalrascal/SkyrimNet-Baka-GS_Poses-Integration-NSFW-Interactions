name: MarkPlayer
description: |
  [REV-156 DRAFT - pending-approvals register entry 35; wording at the user's pen]
  An NPC who wants to humiliate the player, or mark ownership of them, applies a
  tattoo to the player's skin. The NPC decides where the mark goes, which specific
  tattoo it is, and its color, based on their own arousal, mood, and character -
  drawn from the tattoo packs available. The mark is applied to the player's skin.

  WHEN A CHARACTER WOULD DO THIS:
  - A dominant, possessive or sadistic character claiming ownership of the player
  - Humiliating the player with a visible, degrading mark
  - A cultist or slaver branding their new property

  Only when the character genuinely has the power or standing to do this to the
  player. Never on children.

  CONSEQUENCES:
  - The chosen tattoo appears on the player's skin and stays until removed
  - Anyone who sees it can react to the specific mark

questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: MarkPlayer_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: The NPC applying the mark to the player.
  - type: dynamic
    name: asSection
    description: The tattoo pack section to draw the mark from.
  - type: dynamic
    name: asName
    description: The specific tattoo name within that section.
  - type: dynamic
    name: asColor
    description: "Hex color for the mark, e.g. 8b1a1a (optional - pack default if omitted)."

enabled: true
defaultPriority: 2
customCategory: SNBaka_Display