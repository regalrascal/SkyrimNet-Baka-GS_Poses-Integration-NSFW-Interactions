name: PoseCrouch
description: |
  YOU drop low — a scout's crouch, weight forward, eyes working, presence small.
  Held until you stop it, combat starts, or it times out on its own.

  WHEN low and quiet is the job: sneaking through a bandit camp, taking cover behind a low
  wall, examining tracks or a body on the ground, stalking prey, eavesdropping from the
  shadows. Pairs naturally with a line of dialogue — the whispered "stay down," the
  "over there," the hand-signal hiss.
questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: PoseCrouch_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one crouching.

enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true