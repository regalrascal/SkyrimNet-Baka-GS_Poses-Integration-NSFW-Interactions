name: Execute
description: |
  KILL a DEFEATED character with a deliberate finishing blow ("finish them", "end it",
  "put them out of their misery", "no witnesses", "kill the prisoner").

  THE MOMENT: the victim is downed and helpless - beaten, pinned, past resisting - and the
  initiator has decided they are not worth keeping. What a captor does when mercy has no
  place in the arithmetic: a rival silenced, a witness erased, a body too broken to sell,
  or simply a killer who never intended to leave anyone standing.

  WHEN A CHARACTER WOULD DO THIS:
  - A captor who has decided the victim is worth more dead than alive
  - A rival or enemy ensuring the fight is truly over - permanently
  - A witness or liability being erased, quietly and deliberately
  - A cruel or Molag Bal-touched character savoring total power over the helpless
  - A cultist performing a ritual bloodletting
  - A leader they are loyal to demands the death of the victim

  Only on a target already downed - if they're still on their feet, this is not the action.
  Essential or protected characters survive the blow (the kill is released cleanly; nothing
  fights the corpse). Never the player. If you kill, own it - this fires a visible event
  the world reacts to.

# Provenance: derived from Oldcustard's execute-llm-action fork (upstream since deleted;
# user-preserved copy), adopted per user ruling 2026-10-12 (author's community blessing +
# convergent implementation); truth-reconciled to our executor.
# Reconciliation of record (REV-98b, register entry 11): "or TIED" removed; the
# essential/protected survival line kept (TRUE per psc L2102-2107 + ?103 evidence); the
# henchman line omitted (ruled redundant with the leader's-demand line); cultist entry
# kept; ASCII-only per the checklist v8 convention.
questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: Execute_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: The NPC choosing to execute the downed target.
  - type: dynamic
    name: akTarget
    description: The defeated, helpless character being finished off.

enabled: true
defaultPriority: 10
customCategory: SNBaka_Downed
# Same shape as Escalate/HelpUp (REV-90): scene-block eligibility only - no combat gate
# (acting on a downed victim is exactly what happens in/right after a fight) and the
# target-down check is enforced in Execute_Execute, not a decorator (helpup.yaml ruling).
eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
