name: PoseDanceSexy
description: |
  YOU dance slow and provocative — hips leading, eyes holding the one you dance
  for, a performance with a single intended victim.
  Twerking IS this action: told to twerk, dance on someone, shake your hips or
  your backside at them, grind or put on a lewd show — call PoseDanceSexy and
  say so; the pose drawn from the pool matches the wording of the moment
  (slow provocative dancing, twerking while looking back at them, hands-up hip
  dance). There is no separate twerk action — this is it.
  You hold the pose until you choose to stop (use StopPosing) — it also
  ends on its own if a fight starts or after a while.

  WHEN music and low light conspire: tavern entertainment that turns heads, a dare, a bet,
  wine-fuelled showing off, flirtation that has stopped pretending to be anything else. Pairs
  naturally with a line of dialogue — the lyrical tease between the beats.

  OVERRIDING CIRCUMSTANCES: even a shy character, when the wine, the dare, or the crowd has
  loosened them past usual restraint, may let the slip happen — write them surprising themselves.
  The scene gives the reason — a mood, a dare, a look — and without one the
  moment simply passes the pose by.

  THE POOL THIS ACTION DRAWS FROM: twerking while looking back, slow twerking, sensual hips with hands up, a slow hip dance with hand on chin, moving in circles bent low, tik-tok hips, sensual semi-shy swaying, and (for men) a standing lewd suggestion. (REV-161 4.3 moves enrichment - register batch DRAFT; PRIORITY SET: this is the twerk-bearing pool.)
  A fight, real danger, or an ongoing sex scene ends the pose at once — it never
  begins in one.
questEditorId: SkyrimNet_AnimationsGS
scriptName: SkyrimNet_AnimationsGS
executionFunctionName: PoseDanceSexy_Execute
parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one striking the pose.
enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimActorCountFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
