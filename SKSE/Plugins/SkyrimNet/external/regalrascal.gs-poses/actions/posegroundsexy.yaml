name: PoseGroundSexy
description: |
  YOU take a sultry pose down on the ground — a languid, inviting sprawl, low and
  close and unhurried.
  You hold the pose until you choose to stop (use StopPosing) — it also
  ends on its own if a fight starts or after a while.

  WHEN intimacy has already found its level: an intimate moment on the furs, afterglow, lounging
  provocatively on a bedroll. Pairs naturally with a line of dialogue — the low invitation,
  the "come here."

  OVERRIDING CIRCUMSTANCES: even a shy character, when desire, drink, or a flattering crowd has
  loosened them past usual restraint, may let the slip happen — write them deciding to stay down.
  The scene gives the reason — a mood, a dare, a look — and without one the
  moment simply passes the pose by.

  THE POOL THIS ACTION DRAWS FROM: all fours and suggestive, laying with legs up, on the stomach looking back, seated and sexy, waiting and thinking, and twerking on the ground. (REV-161 4.3 moves enrichment - register batch DRAFT; PRIORITY SET: this is the twerk-bearing pool.)
  A fight, real danger, or an ongoing sex scene ends the pose at once — it never
  begins in one.
questEditorId: SkyrimNet_AnimationsGS
scriptName: SkyrimNet_AnimationsGS
executionFunctionName: PoseGroundSexy_Execute
parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one striking the pose.
enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimActorCountFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
