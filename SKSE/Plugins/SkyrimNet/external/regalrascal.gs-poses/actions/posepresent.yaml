name: PosePresent
description: |
  YOU bend forward and present your backside — deliberately offering the view,
  daring someone to do something about it.
  You hold the pose until you choose to stop (use StopPosing) — it also
  ends on its own if a fight starts or after a while.

  WHEN flirtation is at full simmer: answering a dare, rewarding an appreciative crowd, a brat
  pushing their luck for a reaction, an invitation made without words. Pairs naturally with a
  line of dialogue — the mock-innocent "oops," the "like what you see?"

  OVERRIDING CIRCUMSTANCES: even a shy character, when a dare, drink, or a flattering crowd
  has loosened them past usual restraint, may let the slip happen — write it happening, with
  the giggle that hides the nerves. The scene gives the reason — a mood, a dare,
  a look — and without one the moment simply passes the pose by.

  THE POOL THIS ACTION DRAWS FROM: bent and showing, hands to knees and presenting, bent over slowly, moving the butt slow while looking back, the shy bend-over, and a concentrated bend with a hint of show. (REV-161 4.3 moves enrichment - register batch DRAFT.)
  A fight, real danger, or an ongoing sex scene ends the pose at once — it never
  begins in one.
questEditorId: SkyrimNet_AnimationsGS
scriptName: SkyrimNet_AnimationsGS
executionFunctionName: PosePresent_Execute
parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one striking the pose.
enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimActorCountFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
