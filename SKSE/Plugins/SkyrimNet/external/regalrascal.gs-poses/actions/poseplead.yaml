name: PosePlead
description: |
  YOU (a female NPC) kneel to plead, pray, or beg — lowered before the person or power you're
  addressing, the posture of asking for something that matters.
  You hold the pose until you choose to stop (use StopPosing) — it also
  ends on its own if a fight starts or after a while.

  WHEN words need weight behind them: begging for mercy, pleading for someone to truly listen,
  a prayer, a desperate petition to authority, an apology too heavy to make standing up.
  Pairs naturally with a line of dialogue — the plea itself, the vow, the whispered prayer.
  Register-calibrated phrasing: the desire register kneels the same way — also
  desire stripped past pride, begging for the one thing you won't name aloud.

  THE POOL THIS ACTION DRAWS FROM: the deep dogeza bow, a praying apology, begging for money. (REV-161 4.3 moves enrichment - register batch DRAFT.)
  A fight, real danger, or an ongoing sex scene ends the pose at once — it never
  begins in one.
questEditorId: SkyrimNet_AnimationsGS
scriptName: SkyrimNet_AnimationsGS
executionFunctionName: PosePlead_Execute
parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one striking the pose.
enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimActorCountFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
