name: PoseSelfTouch
description: |
  YOU touch yourself suggestively in plain view — hands drifting over your own
  body, arousal worn openly.
  You hold the pose until you choose to stop (use StopPosing) — it also
  ends on its own if a fight starts or after a while.

  WHEN heat is up and shame is down: flirtation an audience wants more of, a dare that went
  further than anyone expected, wine-warmed showing off, an exhibitionist streak finding its
  moment. Pairs naturally with a line of dialogue — the unashamed taunt, the soft gasp, the
  invitation to keep watching.

  OVERRIDING CIRCUMSTANCES: even a shy character, when desire or drink has loosened them past
  usual restraint, may let the slip happen — write the moment they stop pretending they aren't
  enjoying the attention. The scene gives the reason — a mood, a dare, a look —
  and without one the moment simply passes the pose by.

  THE POOL THIS ACTION DRAWS FROM: touching self horny and very horny, spanking self provocatively, touching the chest suggestively, shyly touching, and touching all over. (REV-161 4.3 moves enrichment - register batch DRAFT.)
  A fight, real danger, or an ongoing sex scene ends the pose at once — it never
  begins in one.
questEditorId: SkyrimNet_AnimationsGS
scriptName: SkyrimNet_AnimationsGS
executionFunctionName: PoseSelftouch_Execute
parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one striking the pose.
enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimActorCountFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
