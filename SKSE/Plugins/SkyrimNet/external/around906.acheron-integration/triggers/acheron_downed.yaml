name: "acheron_downed"
description: "A character is defeated and lying helpless on the ground. A nearby character may Escalate, HelpUp, or Release them (or a Baka intermediate action first). Fires on defeat and repeats while they stay down."

eventCriteria:
  eventType: "acheron_downed"

response:
  type: "direct_narration"
  content: |
    {{ target }} is down{% if originator %}, beaten by {{ originator }}{% endif %}. Nearby actors can talk
    to them first — interrogate, threaten, mock, demand their surrender or belongings — but must still
    resolve the moment: call the action, don't just narrate — Execute, PinHelpless, ChokeHelpless,
    HelpUp, or Release. Execute is the deliberate killing blow on a downed victim — first when the
    loser is an enemy the winner wants dead.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 10
