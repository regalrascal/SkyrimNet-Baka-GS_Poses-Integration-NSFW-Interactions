name: "acheron_downed"
description: "A character is defeated and lying helpless on the ground. A nearby character may Escalate, HelpUp, or Release them (or a Baka intermediate action first). Fires on defeat and repeats while they stay down."

eventCriteria:
  eventType: "acheron_downed"

response:
  type: "direct_narration"
  content: |
    {{ target }} is down{% if originator %}, beaten by {{ originator }}{% endif %}. The moment
    wants an end, and the acts are close at hand: an executioner's finishing blow (Execute --
    the deliberate killing blow on a downed victim, the one a victor chooses when the loser is
    an enemy wanted dead), pinning them where they lie (PinHelpless), a chokehold
    (ChokeHelpless), a helping hand up (HelpUp), or walking away and letting them crawl off
    (Release). Words can fill the space first -- questions, threats, mockery, demands for
    surrender or belongings -- but the moment ends in one of these.

audience: "nearby_npcs"

enabled: true
probability: 1
cooldownSeconds: 30
priority: 10
