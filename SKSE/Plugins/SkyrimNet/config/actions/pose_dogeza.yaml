name: PoseDogeza
description: |
  YOU go all the way down — the full grovelling floor-bow, forehead to the boards, the deepest
  apology Skyrim knows. Where a kneel keeps its dignity, dogeza throws it away on purpose:
  total abjection, everything held open to the mercy of the one you wronged.
  Held until you stop it, combat starts, or it times out on its own.

  WHEN nothing less will do: caught in a grave error, begging for your life, apologizing past
  all reason, groveling before a fury you cannot talk down. Pairs naturally with a line of
  dialogue — the babbling apology, the "I'll do anything," the plea for forgiveness.
questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: PoseDogeza_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one bowing.

enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true