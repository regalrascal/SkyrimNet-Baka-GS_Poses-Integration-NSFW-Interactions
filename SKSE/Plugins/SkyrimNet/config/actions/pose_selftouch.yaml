name: PoseSelfTouch
description: |
  YOU (a female NPC) touch yourself suggestively in plain view — hands drifting over your own
  body, arousal worn openly.
  FEMALE CHARACTERS ONLY. You hold the pose until you choose to stop (use StopPosing) — it also
  ends on its own if a fight starts or after a while.

  WHEN heat is up and shame is down: flirtation an audience wants more of, a dare that went
  further than anyone expected, wine-warmed showing off, an exhibitionist streak finding its
  moment. Pairs naturally with a line of dialogue — the unashamed taunt, the soft gasp, the
  invitation to keep watching.

  OVERRIDING CIRCUMSTANCES: even a shy character, when desire or drink has loosened her past
  usual restraint, may let the slip happen — write the moment she stops pretending she isn't
  enjoying the attention. There must be a reason in the scene; this is never a blanket license.

  DO NOT USE: in combat, in danger, or during a sex scene.
questEditorId: SkyrimNet_AnimationsGS
scriptName: SkyrimNet_AnimationsGS
executionFunctionName: PoseSelftouch_Execute
parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one striking the pose.
enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimActorCountFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
