name: PoseScratchHead
description: |
  YOU scratch your head — confused, caught out, the universal gesture for not knowing what
  else to do with yourself.
  Held until you stop it, combat starts, or it times out on its own.

  WHEN puzzled: handed a contradiction, asked to explain the unexplainable, caught in a
  small lie, watching a plan stop making sense. Pairs naturally with a line of dialogue —
  the "wait, what?", the "how does that even..."
questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: PoseScratchHead_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one scratching your head.

enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true