name: PosePresent
description: |
  YOU (a female NPC) bend forward and present your backside — deliberately offering the view,
  daring someone to do something about it.
  FEMALE CHARACTERS ONLY. You hold the pose until you choose to stop (use StopPosing) — it also
  ends on its own if a fight starts or after a while.

  WHEN flirtation is at full simmer: answering a dare, rewarding an appreciative crowd, a brat
  pushing her luck for a reaction, an invitation made without words. Pairs naturally with a
  line of dialogue — the mock-innocent "oops," the "like what you see?"

  OVERRIDING CIRCUMSTANCES: even a shy character, when a dare, drink, or a flattering crowd
  has loosened her past usual restraint, may let the slip happen — write it happening, with
  the giggle that hides the nerves. There must be a reason in the scene; this is never a
  blanket license.

  DO NOT USE: in combat, in danger, or during a sex scene.
questEditorId: SkyrimNet_AnimationsGS
scriptName: SkyrimNet_AnimationsGS
executionFunctionName: PosePresent_Execute
parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one striking the pose.
enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimActorCountFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
