name: PoseMeditate
description: |
  YOU settle into deliberate stillness — seated, eyes closed, breath slowing, the noise of the
  world set down for a while.
  Held until you stop it, combat starts, or it times out on its own.

  WHEN quiet is the point: dawn discipline before the day starts, steadying yourself after
  horror, communing at a shrine, a monk's habit, waiting out a storm of your own thoughts.
  Pairs naturally with a line of dialogue — the murmured mantra, the "give me a moment."
questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: PoseMeditate_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one meditating.

enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true