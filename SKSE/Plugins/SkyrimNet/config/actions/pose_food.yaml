name: PoseFood
description: |
  YOU react to food or drink put in front of you — FEMALE ONLY: either you dig in with
  unhidden pleasure or you recoil in disgust (which one happens is out of your hands).
  Held until you stop it, combat starts, or it times out on its own.

  WHEN the plate arrives: a meal offered, a tavern dish landing in front of you, a stew
  worth commenting on, something that smells like a mistake. Pairs naturally with a line
  of dialogue — the satisfied hum, the "what IS this?"
questEditorId: SkyrimNet_BakaIntegration
scriptName: SkyrimNet_BakaIntegration
executionFunctionName: PoseFood_Execute

parameterMapping:
  - type: speaker
    name: akInitiator
    description: YOU — the one reacting to the food.

enabled: true
defaultPriority: 2
customCategory: SNGS_Pose
eligibilityRules:
  - conditions:
      - decoratorName: "is_in_combat"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "is_busy"
        arguments: ["currentActor"]
        comparisonOperator: "=="
        expectedValue: false
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "OStimExcitementFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "SexLabAnimatingFaction"]
        comparisonOperator: "<"
        expectedValue: 0
    logicalOperator: "AND"
    required: true