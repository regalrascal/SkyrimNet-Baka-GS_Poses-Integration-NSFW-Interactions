<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SNBaka SlaveTats</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: transparent;
         font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif; }
  #backdrop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              background: rgba(0,0,0,0.45); opacity: 0; pointer-events: none; transition: opacity .22s ease; }
  #backdrop.visible { opacity: 1; pointer-events: all; }
  #panel { zoom: 1.5; position: relative; min-width: 480px; max-width: 560px; width: 520px;
           max-height: 88vh; display: flex; flex-direction: column;
           background: linear-gradient(160deg, rgba(10,8,5,.97) 0%, rgba(18,13,6,.97) 100%);
           border: 1px solid rgba(139,105,20,.55);
           box-shadow: 0 0 0 1px rgba(196,162,72,.08), 0 12px 48px rgba(0,0,0,.85), inset 0 0 60px rgba(0,0,0,.4);
           transform: translateY(-10px) scale(.99); opacity: 0; transition: transform .22s ease, opacity .22s ease; }
  #backdrop.visible #panel { transform: none; opacity: 1; }
  h1 { font-size: 17px; font-weight: normal; letter-spacing: .18em; text-transform: uppercase;
       color: #c4a248; padding: 14px 18px 4px; text-align: center; }
  .hint { font-size: 12px; color: rgba(214,200,168,.55); text-align: center; padding: 0 18px 10px;
          border-bottom: 1px solid rgba(139,105,20,.25); }
  .body { padding: 12px 16px; overflow-y: auto; }
  .slot { display: flex; align-items: center; gap: 10px; padding: 7px 10px; margin-bottom: 6px;
          border: 1px solid rgba(139,105,20,.35); border-radius: 3px; cursor: pointer; }
  .slot:hover { border-color: rgba(196,162,72,.7); }
  .slot.active { border-color: #c4a248; background: rgba(196,162,72,.08); }
  .slot .tag { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #c4a248; width: 92px; }
  .slot .val { flex: 1; font-size: 13px; color: #d6c8a8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .val.none { color: rgba(214,200,168,.35); font-style: italic; }
  .slot .clear { font-size: 11px; color: rgba(214,200,168,.6); border: 1px solid rgba(139,105,20,.35);
                 border-radius: 3px; padding: 2px 8px; cursor: pointer; }
  .slot .clear:hover { color: #e0b4b4; border-color: rgba(180,80,80,.6); }
  .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(196,162,72,.6);
           margin: 10px 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tile { font-size: 12.5px; color: #d6c8a8; text-align: center; padding: 7px 6px; border-radius: 3px;
          border: 1px solid rgba(139,105,20,.35); cursor: pointer; overflow: hidden; text-overflow: ellipsis;
          white-space: nowrap; }
  .tile:hover { border-color: rgba(196,162,72,.7); background: rgba(196,162,72,.08); }
  .tile.sel { border-color: #c4a248; background: rgba(196,162,72,.12); color: #e8d5a0; }
  .footer { display: flex; justify-content: center; gap: 12px; padding: 10px 16px 14px;
            border-top: 1px solid rgba(139,105,20,.25); }
  .btn { font-size: 13px; letter-spacing: .08em; color: #d6c8a8; padding: 6px 22px; border-radius: 3px;
         border: 1px solid rgba(139,105,20,.5); cursor: pointer; }
  .btn:hover { border-color: #c4a248; color: #e8d5a0; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="backdrop">
  <div id="panel">
    <h1>SlaveTats Degradation Sets</h1>
    <div class="hint">Pick a slot, then a section and a set. Applied alongside Baka's own marks.</div>
    <div class="body">
      <div class="label">Slots</div>
      <div class="slot" id="slot-spank"><span class="tag">On Spank</span><span class="val"></span><span class="clear">Clear</span></div>
      <div class="slot" id="slot-defeat"><span class="tag">On Defeat</span><span class="val"></span><span class="clear">Clear</span></div>
      <div class="slot" id="slot-escalation"><span class="tag">On Escalation</span><span class="val"></span><span class="clear">Clear</span></div>
      <div class="label">Section</div>
      <div class="grid" id="st-sections"></div>
      <div class="label hidden" id="names-label">Set</div>
      <div class="grid hidden" id="st-names"></div>
    </div>
    <div class="footer"><div class="btn" id="btn-done">Done</div></div>
  </div>
</div>
<script>
// REV-72 SNSlaveTats_Menu — SlaveTats degradation-set picker.
// Opened from Papyrus via SNBakaUI.ShowSlaveTatsMenu(json) → window.snbaka_open_slavetats.
// The pick goes back on the shared snbaka_chose listener as "slot;section;name"
// ("cancel" on dismiss); the DLL dispatches it to SkyrimNet_BakaIntegration._ST_MenuChoice.
let g_slot = null;          // "spank" | "defeat" | "escalation"
let g_sections = [];        // [{ n: section, t: [names] }]
let g_choice = {};          // slot -> "section|name" ("" = empty)

function _el(id) { return document.getElementById(id); }

function _sendChoice(value) {
  try { window.snbaka_chose(value); }
  catch (e) { console.log('[SNBaka.ST] choice =', value, '(snbaka_chose unavailable in browser preview)'); }
}

window.snbaka_open_slavetats = function (payload) {
  const data = (typeof payload === 'string') ? JSON.parse(payload || '{}') : (payload || {});
  g_choice = {
    spank:      (data.spank     === undefined) ? '' : String(data.spank),
    defeat:     (data.defeat    === undefined) ? '' : String(data.defeat),
    escalation: (data.escalation === undefined) ? '' : String(data.escalation),
  };
  g_sections = Array.isArray(data.sections) ? data.sections : [];
  g_slot = null;
  _render();
  _el('backdrop').classList.add('visible');
};

function _render() {
  for (const slot of ['spank', 'defeat', 'escalation']) {
    const row = _el('slot-' + slot);
    row.classList.toggle('active', g_slot === slot);
    const val = row.querySelector('.val');
    const cur = g_choice[slot] || '';
    val.textContent = cur ? cur.replace('|', ' — ') : 'none chosen';
    val.classList.toggle('none', !cur);
    row.querySelector('.clear').style.visibility = cur ? 'visible' : 'hidden';
  }
  const secGrid = _el('st-sections');
  secGrid.innerHTML = '';
  const curSec = g_slot ? (g_choice[g_slot] || '').split('|')[0] : '';
  g_sections.forEach(s => {
    const t = document.createElement('div');
    t.className = 'tile' + (curSec && s.n === curSec ? ' sel' : '');
    t.textContent = s.n;
    t.title = s.n;
    t.onclick = () => _pickSection(s.n);
    secGrid.appendChild(t);
  });
  if (!g_sections.length) {
    const t = document.createElement('div');
    t.className = 'tile';
    t.style.gridColumn = '1 / -1';
    t.textContent = 'No SlaveTats sections discovered — enable a pack and Refresh in the MCM.';
    secGrid.appendChild(t);
  }
  const namesGrid = _el('st-names');
  namesGrid.innerHTML = '';
  namesGrid.classList.add('hidden');
  _el('names-label').classList.add('hidden');
}

function _renderNames(section) {
  const namesGrid = _el('st-names');
  namesGrid.innerHTML = '';
  namesGrid.classList.remove('hidden');
  _el('names-label').classList.remove('hidden');
  const sec = g_sections.find(s => s.n === section);
  const curName = g_slot ? (g_choice[g_slot] || '').split('|')[1] : '';
  (sec ? sec.t : []).forEach(nm => {
    const t = document.createElement('div');
    t.className = 'tile' + (nm === curName ? ' sel' : '');
    t.textContent = nm;
    t.title = nm;
    t.onclick = () => _pickName(section, nm);
    namesGrid.appendChild(t);
  });
}

function _pickSection(name) {
  if (!g_slot) return;
  _render();
  _renderNames(name);
}

function _pickName(section, name) {
  if (!g_slot) return;
  _sendChoice(g_slot + ';' + section + ';' + name);
  _close();
}

// Slot rows: click body = select slot; click Clear = clear it.
document.querySelectorAll('.slot').forEach(row => {
  row.addEventListener('click', e => {
    const slot = row.id.replace('slot-', '');
    if (e.target.classList.contains('clear')) {
      _sendChoice(slot + ';;');
      g_choice[slot] = '';
      _render();
      return;
    }
    g_slot = slot;
    _render();
    const curSec = (g_choice[slot] || '').split('|')[0];
    if (curSec) _renderNames(curSec);
  });
});

_el('btn-done').addEventListener('click', () => _sendChoice('cancel'));
_el('backdrop').addEventListener('click', e => { if (e.target.id === 'backdrop') _sendChoice('cancel'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); _sendChoice('cancel'); }
});
_el('backdrop').classList.remove('visible');
function _close() { _el('backdrop').classList.remove('visible'); }

// Browser preview (inert inside Skyrim/PrismaUI).
(function () {
  if (typeof window.snbaka_chose === 'function') return;
  window.snbaka_open_slavetats({
    spank: 'Sluts|cumdump', defeat: '', escalation: '',
    sections: [
      { n: 'Sluts', t: ['cumdump', 'petgirl', 'breeder'] },
      { n: 'Mind tricks', t: ['hypno_eyes', 'heart_nipples'] },
      { n: 'Tears and shame', t: ['used', 'broken'] },
    ]
  });
})();
</script>
</body>
</html>
